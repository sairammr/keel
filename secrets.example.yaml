# Copy to secrets.yaml (gitignored) and export the mapped env vars before `cre workflow simulate`.
# Maps the secret IDs the KEEL handler requests via runtime.getSecret({ id }) to the env vars
# holding their values. In production these are released by the Vault DON into the attested enclave.
# NEVER commit real values — only the env-var names live here.
secretsNames:
    keel_policy:
        - KEEL_POLICY
    keel_salt:
        - KEEL_SALT
    keel_rpc_url:
        - KEEL_RPC_URL
    liquidation_private_key:
        - LIQUIDATION_PRIVATE_KEY
