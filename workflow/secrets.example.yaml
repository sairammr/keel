# KEEL workflow secrets — EXAMPLE. Values are placeholders, NOT real. Copy to secrets.yaml.
#
# Maps each Vault secret id → an env var (read from .env in simulation, from the Vault DON when
# deployed). Simulation: `cre workflow simulate ... ` reads these from .env.
# Deploy:      `cre secrets create secrets.yaml --target staging-settings --secrets-auth=browser`
#
# NONE of these values may ever appear in config.*.json, logs, or the repo.
secretsNames:
  keel_base_bp:
    - KEEL_BASE_BP
  keel_kvol_bp:
    - KEEL_KVOL_BP
  keel_volcap_bp:
    - KEEL_VOLCAP_BP
  keel_jitter_bp:
    - KEEL_JITTER_BP
  keel_tmax_bp:
    - KEEL_TMAX_BP
  keel_emerg_bp:
    - KEEL_EMERG_BP
  keel_buffer_bp:
    - KEEL_BUFFER_BP
  keel_target_cap_bp:
    - KEEL_TARGET_CAP_BP
  keel_halflife:
    - KEEL_HALFLIFE
  keel_cooldown:
    - KEEL_COOLDOWN
  keel_max_repay_bp:
    - KEEL_MAX_REPAY_BP
  keel_max_deposit:
    - KEEL_MAX_DEPOSIT
  keel_t_est_s:
    - KEEL_T_EST_S
  keel_salt:
    - KEEL_SALT
  keel_rpc_url:
    - KEEL_RPC_URL
  liquidation_private_key:
    - LIQUIDATION_PRIVATE_KEY
