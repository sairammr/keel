# KEEL workflow secrets — EXAMPLE. Values are placeholders, NOT real. Copy to the REPO ROOT
# as secrets.yaml (workflow.yaml points secrets-path: "../secrets.yaml"):
#
#     cp workflow/secrets.example.yaml secrets.yaml     # run from the repo root
#
# Maps each Vault secret id → an env var (read from .env in simulation, from the Vault DON when
# deployed). Simulation: `cre workflow simulate ...` reads these from .env.
# Deploy:      `cre secrets create secrets.yaml --target staging-settings --secrets-auth=browser`
#
# The handler fetches exactly these FOUR ids per tick (CRE quota ≤ 5). The 13 policy parameters
# are packed into the single JSON secret `keel_policy` (< 2 KB) — see workflow/src/policy.ts.
# NONE of these values may ever appear in config.*.json, logs, or the repo.
secretsNames:
  keel_policy:
    - KEEL_POLICY
  keel_salt:
    - KEEL_SALT
  keel_rpc_url:
    - KEEL_RPC_URL
  liquidation_private_key:
    - LIQUIDATION_PRIVATE_KEY
